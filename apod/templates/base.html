<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}NASA APOD{% endblock %}</title>
</head>
<body>
  <nav>
    <a href="{% url 'apod:home' %}">Home</a>
    |
    <a href="{% url 'apod:archive_form' %}">View a past date</a>
    |
    {% if user.is_authenticated %}
      Logged in as {{ user.username }}
      <form action="{% url 'logout' %}" method="post" style="display:inline">
        {% csrf_token %}
        <button type="submit">Logout</button>
      </form>
    {% else %}
      <a href="{% url 'login' %}">Login</a>
    {% endif %}
  </nav>
  <hr>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
